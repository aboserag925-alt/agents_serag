name: Agents Hub tests

on:
  push:
    branches:
      - feature/autonomous-hub-security-real-tests
  pull_request:
    branches:
      - main
      - termux-upload

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
