name: Security unit tests

on:
  push:
    branches:
      - fix/security-baseline
  pull_request:
    branches:
      - main
      - termux-upload

permissions:
  contents: read

jobs:
  security-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security gate unit tests
        run: python -m unittest discover -s tests -v
