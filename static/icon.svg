<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Symphony Glowing Star Symbol -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Star -->
    <path d="M 0 -180 L 38 -55 L 170 -55 L 68 25 L 105 155 L 0 75 L -105 155 L -68 25 L -170 -55 L -38 -55 Z" 
          fill="url(#symGrad)" opacity="0.95"/>
    
    <!-- Secondary Diamond Star -->
    <path d="M 0 -130 L 30 -30 L 130 0 L 30 30 L 0 130 L -30 30 L -130 0 L -30 -30 Z" 
          fill="url(#innerGrad)" opacity="0.85"/>

    <!-- Central Luminous Core -->
    <circle cx="0" cy="0" r="32" fill="#ffffff"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#67e8f9" stroke-width="6" opacity="0.8"/>
  </g>
</svg>
